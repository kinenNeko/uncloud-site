<!doctype html><html><head><meta charset="utf-8"><title>音频测试</title></head>
<body style="background:#141019;color:#ddd;font-family:sans-serif;padding:20px">
<h3>音频诊断</h3>
<audio id="a" controls loop style="width:100%"></audio>
<pre id="o" style="font-size:13px;white-space:pre-wrap"></pre>
<script>
var a=document.getElementById('a'),o=document.getElementById('o');
a.src='music/bgm.mp3';
function log(s){o.textContent+=s+"\n";}
log('UA: '+navigator.userAgent);
a.addEventListener('loadedmetadata',function(){
  log('duration: '+a.duration);
  log('playbackRate: '+a.playbackRate);
  log('defaultPlaybackRate: '+a.defaultPlaybackRate);
  log('preservesPitch: '+a.preservesPitch);
  log('--- 应约为 134.1 秒，若显示约 123 秒则说明解码器把采样率算错 ---');
});
a.addEventListener('error',function(){log('error: '+a.error.code);});
</script>
</body></html>
